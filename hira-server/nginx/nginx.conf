# hira-server/nginx/nginx.conf — proxy reverso mínimo hacia `backend`
# (RF-001, `SRV-001-walking-skeleton` T-018).
#
# Nota de deuda ya documentada (no resolver aquí): `docs/hira-server/spec/
# implementation-guide/guia-backend.md` registra la migración pendiente
# Nginx → Caddy global de infraestructura compartida. Este sprint sigue
# exigiendo `nginx` en el compose.

server {
    listen 80;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
