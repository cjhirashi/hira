# hira-server/mosquitto/mosquitto.conf — RF-006, VUL-SRV-001
# (`.harness/specs/SRV-001-walking-skeleton/`).
#
# Autenticación obligatoria: sin conexiones anónimas. La credencial vive en
# `password_file` (generado por `generate_password_file.sh` desde
# `MQTT_USER`/`MQTT_PASSWORD` del entorno — nunca en claro en este repo).

listener 1883

allow_anonymous false
password_file /mosquitto/config/password_file

# Sin persistencia en disco en este sprint (walking skeleton, sin retención de
# mensajes todavía) — evita depender de un volumen adicional.
persistence false

log_dest stdout
