openapi: 3.0.3
info:
  title: Hira Server API
  description: >
    Contrato interno de `hira-server` (Contract-First, `SRV-ADR-017`). Desde
    `SRV-001-walking-skeleton` expone `GET /health`; `SRV-002-auth-rbac` añade
    `POST /auth/login|refresh|logout` (autenticación JWT + RBAC de 3 roles fijos,
    `SRV-ADR-005`); `SRV-003-bacnet-adapter` añade `POST /devices/scan/bacnet`,
    `GET /devices`, `GET /devices/{id}/candidates` (escaneo BACnet/IP Who-Is/
    I-Am y persistencia de candidatos crudos, `SRV-ADR-012`). `SRV-004-modbus-
    adapter` añade `POST /devices/scan/modbus` (sondeo de rangos de registros
    Modbus TCP — coils, discrete inputs, holding registers, input registers —
    y persistencia de candidatos, mismo modelo `devices`/
    `device_points_candidates`, sin descubrimiento nativo a diferencia de
    BACnet). `SRV-005-mqtt-scanning` añade `POST /devices/scan/mqtt`
    (suscripción wildcard MQTT durante una ventana de 3 segundos, captura de
    topics activos como candidatos — push-based, sin descubrimiento previo
    tipo Who-Is, un `device` = el patrón de suscripción completo). El sobre
    de error de los endpoints de negocio sigue RFC 9457 (`ProblemDetail`,
    `E-ADR-003`) — `GET /health` es la única excepción (endpoint de
    monitoreo, siempre HTTP 200, ver su descripción).
  version: "0.5.0"
paths:
  /auth/login:
    post:
      operationId: login
      summary: Autentica con email/password y emite un par de tokens JWT
      description: >
        RF-001, RF-002, RF-014 (`.harness/specs/SRV-002-auth-rbac/spec.md`). Emite
        un access token (TTL 15 min) y un refresh token (TTL 7 días,
        revocable). Cualquier fallo de credenciales (email inexistente, password
        incorrecto, usuario desactivado) responde con el **mismo** 401 genérico
        (RF-002, evita enumeración de usuarios) e incrementa un contador de
        intentos fallidos por `email`+IP de origen; al 6º intento fallido en 15
        minutos, responde 429 (RF-014) sin evaluar credenciales.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credenciales válidas — par de tokens emitido (RF-001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Credenciales inválidas (RF-002) — mensaje genérico.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                invalid_credentials:
                  value:
                    type: "https://hira.dev/errors/invalid-credentials"
                    title: "Credenciales inválidas"
                    status: 401
                    detail: "El email o el password no coinciden con ningún usuario activo."
        "429":
          description: Demasiados intentos fallidos para esta combinación email+IP (RF-014).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                rate_limited:
                  value:
                    type: "https://hira.dev/errors/rate-limited"
                    title: "Demasiados intentos"
                    status: 429
                    detail: "Se excedieron los 5 intentos permitidos en 900 segundos para esta combinación."
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Emite un nuevo access token a partir de un refresh token vigente
      description: >
        RF-011, RF-013. El nuevo access token lleva el `rol`/`scope`/`project_id`
        **vigentes** del usuario (no los capturados en el refresh al momento del
        login) — un cambio de rol aplica también en el próximo refresh.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh válido y no revocado — nuevo access token (RF-011).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          description: >
            Refresh inválido (`token-invalid`), expirado (`token-expired`) o
            revocado (`token-revoked`, RF-013) — no se emite un nuevo access.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                token_expired:
                  value:
                    type: "https://hira.dev/errors/token-expired"
                    title: "Token expirado"
                    status: 401
                    detail: "El refresh token expiró; inicie sesión de nuevo."
                token_revoked:
                  value:
                    type: "https://hira.dev/errors/token-revoked"
                    title: "Refresh token revocado"
                    status: 401
                    detail: "Este refresh token ya fue revocado (logout o expiración de cache)."
  /auth/logout:
    post:
      operationId: logout
      summary: Revoca un refresh token (cierre de sesión)
      description: >
        RF-010. Requiere estar autenticado (`AuthenticationMiddleware`, batch
        posterior de `tasks.md` — cierra su propia sesión). Revoca el refresh
        token recibido en el body (`DEL refresh:{jti}` en cache); idempotente —
        invocarlo dos veces, o con un refresh ya inválido/expirado, no falla.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Refresh token revocado (o ya no vigente) — sin contenido.
  /devices/scan/bacnet:
    post:
      operationId: scanBacnetDevices
      summary: Escanea la red BACnet/IP (Who-Is/I-Am) y persiste candidatos
      description: >
        RF-001, RF-002, RF-006, RF-008 (`.harness/specs/SRV-003-bacnet-adapter/
        spec.md`). Emite un Who-Is broadcast y espera respuestas I-Am durante 3
        segundos; por cada dispositivo que responde, lee su lista de objetos
        (timeout de 2 segundos) y persiste/actualiza el dispositivo en
        `devices` y sus puntos crudos en `device_points_candidates` — nunca
        promueve un candidato a una tabla de puntos operables (`SRV-ADR-012`).
        Un dispositivo que no responde a la lectura de objetos se registra
        (log) y no aborta el resto del escaneo (RF-006). Sin ningún I-Am,
        responde 200 con una lista vacía (RF-008, no es un error). Requiere rol
        Admin u Operador (RF-003).
      tags:
        - devices
      responses:
        "200":
          description: >
            Dispositivos tocados por este escaneo (puede ser `[]` si nadie
            respondió, RF-008).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceOut"
        "403":
          description: Rol Visor invocando el escaneo (RF-003).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                insufficient_role:
                  value:
                    type: "https://hira.dev/errors/insufficient-role"
                    title: "Rol insuficiente"
                    status: 403
                    detail: "Se requiere uno de los roles: admin, operador."
  /devices/scan/modbus:
    post:
      operationId: scanModbusDevices
      summary: Sondea un rango de registros Modbus TCP y persiste candidatos
      description: >
        RF-001, RF-002, RF-004, RF-005, RF-007 (`.harness/specs/
        SRV-004-modbus-adapter/spec.md`). A diferencia de BACnet, Modbus no
        tiene descubrimiento nativo — el llamador indica `host`/`port`/
        `unit_id` y, por cada uno de los 4 tipos de registro (`coils`,
        `discrete_inputs`, `holding_registers`, `input_registers`), un rango
        opcional `{start, count}`; un tipo sin rango no se escanea. Lee cada
        dirección del rango (timeout de 1 segundo por dirección, RF-008) y
        persiste/actualiza el dispositivo en `devices`
        (`protocol='modbus'`, dirección `"<host>:<port>:<unit_id>"`) y sus
        puntos crudos en `device_points_candidates` — solo si al menos una
        dirección respondió con éxito; nunca promueve un candidato a una
        tabla de puntos operables (`SRV-ADR-012`). Una dirección sin
        respuesta se registra (log) y no aborta el resto del rango (RF-005).
        Ningún rango puede exceder 125 direcciones (RF-004) — de lo
        contrario responde 400 sin ejecutar ninguna lectura. Sin ninguna
        dirección exitosa, responde 200 con una lista vacía (RF-007, no es
        un error). Requiere rol Admin u Operador (RF-003).
      tags:
        - devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanModbusRequest"
      responses:
        "200":
          description: >
            Candidatos nuevos/actualizados de este escaneo (puede ser `[]`
            si ninguna dirección respondió, RF-007).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceCandidateOut"
        "400":
          description: Algún rango solicitado excede 125 direcciones (RF-004).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                modbus_range_too_large:
                  value:
                    type: "https://hira.dev/errors/modbus-range-too-large"
                    title: "Rango de registros demasiado grande"
                    status: 400
                    detail: "El rango solicitado para 'holding_register' tiene 200 direcciones; el máximo permitido por tipo de registro es 125."
        "403":
          description: Rol Visor invocando el escaneo (RF-003).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                insufficient_role:
                  value:
                    type: "https://hira.dev/errors/insufficient-role"
                    title: "Rol insuficiente"
                    status: 403
                    detail: "Se requiere uno de los roles: admin, operador."
  /devices/scan/mqtt:
    post:
      operationId: scanMqttDevices
      summary: Se suscribe a un patrón MQTT durante una ventana de 3s y persiste candidatos
      description: >
        RF-001, RF-002, RF-004, RF-006 (`.harness/specs/SRV-005-mqtt-scanning/
        spec.md`). A diferencia de BACnet/Modbus (request/response), MQTT es
        push-based: el llamador indica un `topic_pattern` de suscripción
        (wildcard, p. ej. `"edificio/piso1/#"`) y el sistema se suscribe y
        espera mensajes durante 3 segundos. Un `device` = el patrón de
        suscripción completo (`protocol='mqtt'`, `address=topic_pattern`,
        creándolo si no existe); cada topic real que publicó durante la
        ventana es un candidato de ese `device` en
        `device_points_candidates` (`object_type='mqtt_topic'`,
        `present_value` = payload del **último** mensaje de ese topic) —
        actualiza si ya existía, no duplica. Nunca promueve un candidato a
        una tabla de puntos operables (`SRV-ADR-012`). Sin ningún mensaje
        durante la ventana, responde 200 con una lista vacía, sin crear
        `device` (RF-006, no es un error). Requiere rol Admin u Operador
        (RF-003).
      tags:
        - devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanMqttRequest"
      responses:
        "200":
          description: >
            Candidatos nuevos/actualizados de este escaneo (puede ser `[]`
            si ningún mensaje llegó, RF-006).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceCandidateOut"
        "400":
          description: >
            `topic_pattern` rechazado por la librería MQTT al suscribirse (RF-004).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                mqtt_invalid_topic_pattern:
                  value:
                    type: "https://hira.dev/errors/mqtt-invalid-topic-pattern"
                    title: "Patrón de topic MQTT inválido"
                    status: 400
                    detail: "El patrón de topic 'edificio/#/piso1' fue rechazado: Invalid subscription filter."
        "403":
          description: Rol Visor invocando el escaneo (RF-003).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                insufficient_role:
                  value:
                    type: "https://hira.dev/errors/insufficient-role"
                    title: "Rol insuficiente"
                    status: 403
                    detail: "Se requiere uno de los roles: admin, operador."
  /devices:
    get:
      operationId: listDevices
      summary: Lista los dispositivos persistidos
      description: >
        RF-004. Lista todos los dispositivos ya descubiertos (por cualquier
        protocolo, solo `bacnet` con datos reales en esta feature), con su
        protocolo, dirección, `is_simulator` y `last_seen_at`. Requiere rol
        Admin u Operador (RF-003).
      tags:
        - devices
      responses:
        "200":
          description: Dispositivos persistidos (puede ser `[]`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceOut"
        "403":
          description: Rol Visor invocando el listado (RF-003).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /devices/{id}/candidates:
    get:
      operationId: listDeviceCandidates
      summary: Lista los puntos crudos candidatos de un dispositivo
      description: >
        RF-005. Lista los puntos crudos descubiertos (`device_points_candidates`)
        de un dispositivo — nunca puntos operables asociados (`SRV-ADR-012`,
        feature de asociación explícita posterior). Requiere rol Admin u
        Operador (RF-003).
      tags:
        - devices
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador del dispositivo.
      responses:
        "200":
          description: Candidatos del dispositivo (puede ser `[]`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceCandidateOut"
        "403":
          description: Rol Visor invocando el listado (RF-003).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: El `id` de dispositivo no existe (RF-009).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                device_not_found:
                  value:
                    type: "https://hira.dev/errors/device-not-found"
                    title: "Dispositivo no encontrado"
                    status: 404
                    detail: "No existe un dispositivo con ese id."
  /simulators/bacnet:
    post:
      operationId: startBacnetSimulator
      summary: Arranca un simulador BACnet/IP y lo registra como dispositivo
      description: >
        RF-001, RF-006, RF-007 (`.harness/specs/SRV-006-simuladores/spec.md`).
        Arranca una instancia BACnet/IP real que responde a Who-Is con
        `device_instance` y expone `objects` (si los hay) como objetos BACnet
        reales; registra/actualiza en `devices` un dispositivo
        (`protocol='bacnet'`, `is_simulator=true`) con sus `objects` como
        candidatos en `device_points_candidates`. Si `device_instance` ya
        corresponde a un dispositivo real, o ya tiene un simulador en
        ejecución, responde 409 sin arrancar ningún proceso (RF-006). Si
        corresponde a un simulador previamente registrado pero no en
        ejecución (p. ej. tras un reinicio), lo reanuda reutilizando el mismo
        `device_id` (RF-007). Requiere rol Admin.
      tags:
        - simulators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartBacnetSimulatorRequest"
      responses:
        "201":
          description: Simulador arrancado y registrado (RF-001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatorOut"
        "403":
          description: Rol distinto de Admin invocando el arranque (RF-004).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                insufficient_role:
                  value:
                    type: "https://hira.dev/errors/insufficient-role"
                    title: "Rol insuficiente"
                    status: 403
                    detail: "Se requiere uno de los roles: admin."
        "409":
          description: >
            La dirección ya es un dispositivo real, o ya tiene un simulador
            en ejecución (RF-006).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                simulator_address_conflict:
                  value:
                    type: "https://hira.dev/errors/simulator-address-conflict"
                    title: "Dirección ya registrada"
                    status: 409
                    detail: "La dirección '999123' ya corresponde a un dispositivo real."
                simulator_already_running:
                  value:
                    type: "https://hira.dev/errors/simulator-already-running"
                    title: "Simulador ya en ejecución"
                    status: 409
                    detail: "Ya hay un simulador en ejecución en la dirección '999123'."
  /simulators/modbus:
    post:
      operationId: startModbusSimulator
      summary: Arranca un simulador Modbus TCP y lo registra como dispositivo
      description: >
        RF-002, RF-006, RF-007. Arranca un servidor Modbus TCP real en
        `host:port` que responde con `unit_id`, cargado con los valores
        iniciales indicados; registra/actualiza en `devices` un dispositivo
        (`protocol='modbus'`, `is_simulator=true`) con esos valores como
        candidatos. Mismas reglas de conflicto (409, RF-006) y reanudación
        (RF-007) que `POST /simulators/bacnet`. Requiere rol Admin.
      tags:
        - simulators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartModbusSimulatorRequest"
      responses:
        "201":
          description: Simulador arrancado y registrado (RF-002).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatorOut"
        "403":
          description: Rol distinto de Admin invocando el arranque (RF-004).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                insufficient_role:
                  value:
                    type: "https://hira.dev/errors/insufficient-role"
                    title: "Rol insuficiente"
                    status: 403
                    detail: "Se requiere uno de los roles: admin."
        "409":
          description: >
            La dirección ya es un dispositivo real, o ya tiene un simulador
            en ejecución (RF-006).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                simulator_address_conflict:
                  value:
                    type: "https://hira.dev/errors/simulator-address-conflict"
                    title: "Dirección ya registrada"
                    status: 409
                    detail: "La dirección '192.168.1.50:502:1' ya corresponde a un dispositivo real."
                simulator_already_running:
                  value:
                    type: "https://hira.dev/errors/simulator-already-running"
                    title: "Simulador ya en ejecución"
                    status: 409
                    detail: "Ya hay un simulador en ejecución en la dirección '192.168.1.50:502:1'."
  /simulators/mqtt:
    post:
      operationId: startMqttSimulator
      summary: Arranca un publicador MQTT y lo registra como dispositivo
      description: >
        RF-003, RF-006, RF-007, RF-014, RF-015. Arranca un publicador MQTT
        real que publica `payload` en `topic` cada `interval_seconds`
        segundos; registra/actualiza en `devices` un dispositivo
        (`protocol='mqtt'`, `is_simulator=true`), sin candidatos. Mismas
        reglas de conflicto (409, RF-006) y reanudación (RF-007) que
        `POST /simulators/bacnet`. `interval_seconds <= 0` responde 400 sin
        arrancar nada (RF-015); un `topic`/`payload` rechazado por la
        librería MQTT al publicar responde 400 (RF-014). Requiere rol Admin.
      tags:
        - simulators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartMqttSimulatorRequest"
      responses:
        "201":
          description: Publicador arrancado y registrado (RF-003).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatorOut"
        "400":
          description: >
            `interval_seconds <= 0` (RF-015), o `topic`/`payload` rechazado
            por la librería MQTT al publicar (RF-014).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                mqtt_invalid_interval:
                  value:
                    type: "https://hira.dev/errors/mqtt-invalid-interval"
                    title: "Intervalo inválido"
                    status: 400
                    detail: "interval_seconds debe ser > 0, recibido: 0."
                mqtt_invalid_publish:
                  value:
                    type: "https://hira.dev/errors/mqtt-invalid-publish"
                    title: "Publicación MQTT inválida"
                    status: 400
                    detail: "El topic/payload para 'edificio/#' fue rechazado al publicar: Publish topic cannot contain wildcards."
        "403":
          description: Rol distinto de Admin invocando el arranque (RF-004).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                insufficient_role:
                  value:
                    type: "https://hira.dev/errors/insufficient-role"
                    title: "Rol insuficiente"
                    status: 403
                    detail: "Se requiere uno de los roles: admin."
        "409":
          description: >
            La dirección ya es un dispositivo real, o ya tiene un simulador
            en ejecución (RF-006).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                simulator_address_conflict:
                  value:
                    type: "https://hira.dev/errors/simulator-address-conflict"
                    title: "Dirección ya registrada"
                    status: 409
                    detail: "La dirección 'edificio/piso1/ahu1/temp' ya corresponde a un dispositivo real."
                simulator_already_running:
                  value:
                    type: "https://hira.dev/errors/simulator-already-running"
                    title: "Simulador ya en ejecución"
                    status: 409
                    detail: "Ya hay un simulador en ejecución en la dirección 'edificio/piso1/ahu1/temp'."
  /simulators:
    get:
      operationId: listSimulators
      summary: Lista los simuladores actualmente en ejecución
      description: >
        RF-010. Lista únicamente los simuladores actualmente en ejecución
        (protocolo, dirección/identidad, `device_id`, hora de arranque) — ni
        dispositivos reales ni simuladores detenidos (el estado vive en
        memoria del proceso, `spec.md §3`). Requiere rol Admin u Operador.
      tags:
        - simulators
      responses:
        "200":
          description: Simuladores en ejecución (puede ser `[]`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimulatorOut"
        "403":
          description: Rol Visor invocando el listado (RF-005).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                insufficient_role:
                  value:
                    type: "https://hira.dev/errors/insufficient-role"
                    title: "Rol insuficiente"
                    status: 403
                    detail: "Se requiere uno de los roles: admin, operador."
  /simulators/{device_id}:
    delete:
      operationId: stopSimulator
      summary: Detiene un simulador en ejecución
      description: >
        RF-009, RF-012. Detiene el proceso identificado por `device_id` sin
        eliminar el dispositivo ni sus candidatos de `devices`/
        `device_points_candidates` — `is_simulator=true` es permanente en
        esta feature (RF-011). Requiere rol Admin.
      tags:
        - simulators
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador del dispositivo (`devices.id`).
      responses:
        "204":
          description: Simulador detenido — sin contenido (RF-009).
        "403":
          description: Rol distinto de Admin invocando la detención (RF-004).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                insufficient_role:
                  value:
                    type: "https://hira.dev/errors/insufficient-role"
                    title: "Rol insuficiente"
                    status: 403
                    detail: "Se requiere uno de los roles: admin."
        "404":
          description: >
            `device_id` sin ningún simulador actualmente en ejecución — no
            existe, es `is_simulator=false`, o ya está detenido (RF-012).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                simulator_not_running:
                  value:
                    type: "https://hira.dev/errors/simulator-not-running"
                    title: "Simulador no encontrado"
                    status: 404
                    detail: "No hay ningún simulador en ejecución con device_id 'a3d1...'."
  /health:
    get:
      operationId: getHealth
      summary: Estado agregado de salud del backend y sus dependencias
      description: >
        RF-002 (`.harness/specs/SRV-001-walking-skeleton/spec.md`) — agrega el estado
        de PostgreSQL, Redis y Mosquitto. Responde **siempre HTTP 200** (decisión
        cerrada en `spec.md §3`/§6: es un endpoint de monitoreo, no de negocio; un
        fallo de un servicio secundario no debe sacar al backend completo de un
        load balancer). El detalle de cada servicio va en el body, nunca en el
        código de estado HTTP. Sin sobre RFC 9457 para esta frontera.
      tags:
        - monitor
      parameters:
        - in: header
          name: X-Trace-ID
          required: false
          schema:
            type: string
          description: >
            Correlation ID (RF-005). Si no se envía, el backend genera uno (`uuid4()`)
            y lo devuelve tanto en este header de respuesta como en `trace_id` del body.
      responses:
        "200":
          description: >
            Estado agregado (`status`) y el estado individual de cada servicio
            (`services`). Siempre HTTP 200, incluso si `status` es `degraded`.
          headers:
            X-Trace-ID:
              description: Correlation ID propagado o generado para este request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                todo_ok:
                  summary: Los tres servicios responden
                  value:
                    status: ok
                    services:
                      postgres: ok
                      redis: ok
                      mosquitto: ok
                    version: "0.1.0"
                    trace_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                degradado:
                  summary: Al menos un servicio falla (RF-007)
                  value:
                    status: degraded
                    services:
                      postgres: ok
                      redis: error
                      mosquitto: ok
                    version: "0.1.0"
                    trace_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
components:
  schemas:
    ServiceStatus:
      type: string
      enum: [ok, error]
    HealthResponse:
      type: object
      required: [status, services, version, trace_id]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: >
            "ok" si postgres, redis y mosquitto están todos "ok"; "degraded" si al
            menos uno falla (RF-002).
        services:
          type: object
          required: [postgres, redis, mosquitto]
          additionalProperties: false
          properties:
            postgres:
              $ref: "#/components/schemas/ServiceStatus"
            redis:
              $ref: "#/components/schemas/ServiceStatus"
            mosquitto:
              $ref: "#/components/schemas/ServiceStatus"
        version:
          type: string
          example: "0.1.0"
        trace_id:
          type: string
          description: Correlation ID del request (RF-005).
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type]
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: JWT de acceso, TTL 15 min (RF-001).
        refresh_token:
          type: string
          description: JWT de refresco, TTL 7 días, revocable (RF-001).
        token_type:
          type: string
          enum: [bearer]
    AccessTokenResponse:
      type: object
      required: [access_token, token_type]
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: Nuevo JWT de acceso, TTL 15 min, con permisos vigentes (RF-011).
        token_type:
          type: string
          enum: [bearer]
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
    DeviceOut:
      type: object
      description: >
        Dispositivo persistido (`SRV-003-bacnet-adapter`, `plan.md §4`).
      required: [id, name, protocol, address, is_simulator, last_seen_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        protocol:
          type: string
          enum: [bacnet, modbus, mqtt]
        address:
          type: string
          description: >
            `"<instance_number>@<network_address>"` (`core/bacnet_address.py`).
        is_simulator:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
          nullable: true
    DeviceCandidateOut:
      type: object
      description: >
        Punto crudo candidato de un dispositivo (`SRV-003-bacnet-adapter`,
        `plan.md §4`) — nunca un punto operable asociado (`SRV-ADR-012`).
      required:
        [id, object_type, object_instance, object_name, present_value, units, discovered_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        object_type:
          type: string
          example: analogInput
        object_instance:
          type: integer
        object_name:
          type: string
          nullable: true
        present_value:
          type: string
          nullable: true
        units:
          type: string
          nullable: true
        discovered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ModbusRegisterRange:
      type: object
      description: >
        Rango de direcciones a sondear para un tipo de registro Modbus
        (`SRV-004-modbus-adapter`, `plan.md §4`).
      required: [start, count]
      additionalProperties: false
      properties:
        start:
          type: integer
          minimum: 0
        count:
          type: integer
          minimum: 1
          maximum: 125
          description: Máximo 125 direcciones por tipo de registro (RF-004).
    ScanModbusRequest:
      type: object
      description: >
        Body de `POST /devices/scan/modbus` (`SRV-004-modbus-adapter`,
        `plan.md §4`) — un tipo de registro sin rango no se escanea.
      required: [host, port, unit_id]
      additionalProperties: false
      properties:
        host:
          type: string
          minLength: 1
        port:
          type: integer
          minimum: 1
          maximum: 65535
        unit_id:
          type: integer
          minimum: 0
          maximum: 255
        coils:
          $ref: "#/components/schemas/ModbusRegisterRange"
          nullable: true
        discrete_inputs:
          $ref: "#/components/schemas/ModbusRegisterRange"
          nullable: true
        holding_registers:
          $ref: "#/components/schemas/ModbusRegisterRange"
          nullable: true
        input_registers:
          $ref: "#/components/schemas/ModbusRegisterRange"
          nullable: true
    ScanMqttRequest:
      type: object
      description: >
        Body de `POST /devices/scan/mqtt` (`SRV-005-mqtt-scanning`,
        `plan.md §4`).
      required: [topic_pattern]
      additionalProperties: false
      properties:
        topic_pattern:
          type: string
          minLength: 1
          example: "edificio/piso1/#"
          description: >
            Patrón de suscripción MQTT (wildcard `#`/`+` soportados por el
            broker). Validado por la librería MQTT al suscribirse (RF-004).
    BacnetSimulatedObjectIn:
      type: object
      description: >
        Un objeto BACnet inicial del simulador (`SRV-006-simuladores`, RF-001).
      required: [object_type, object_instance, present_value]
      additionalProperties: false
      properties:
        object_type:
          type: string
          enum: [analog-value, analog-input, analog-output, binary-value, binary-input, binary-output]
        object_instance:
          type: integer
          minimum: 0
        present_value:
          type: string
          description: >
            Texto — analog-*: parseable a número; binary-*: "active"/"inactive".
    StartBacnetSimulatorRequest:
      type: object
      description: >
        Body de `POST /simulators/bacnet` (`SRV-006-simuladores`, RF-001).
      required: [device_instance]
      additionalProperties: false
      properties:
        device_instance:
          type: integer
          minimum: 0
          maximum: 4194303
        objects:
          type: array
          items:
            $ref: "#/components/schemas/BacnetSimulatedObjectIn"
    ModbusRegisterValueIn:
      type: object
      description: >
        Un registro inicial del simulador Modbus (`SRV-006-simuladores`, RF-002).
      required: [address, value]
      additionalProperties: false
      properties:
        address:
          type: integer
          minimum: 0
        value:
          oneOf: [{type: boolean}, {type: integer}]
    StartModbusSimulatorRequest:
      type: object
      description: >
        Body de `POST /simulators/modbus` (`SRV-006-simuladores`, RF-002).
      required: [host, port, unit_id]
      additionalProperties: false
      properties:
        host:
          type: string
          minLength: 1
        port:
          type: integer
          minimum: 1
          maximum: 65535
        unit_id:
          type: integer
          minimum: 0
          maximum: 255
        coils:
          type: array
          items:
            $ref: "#/components/schemas/ModbusRegisterValueIn"
        discrete_inputs:
          type: array
          items:
            $ref: "#/components/schemas/ModbusRegisterValueIn"
        holding_registers:
          type: array
          items:
            $ref: "#/components/schemas/ModbusRegisterValueIn"
        input_registers:
          type: array
          items:
            $ref: "#/components/schemas/ModbusRegisterValueIn"
    StartMqttSimulatorRequest:
      type: object
      description: >
        Body de `POST /simulators/mqtt` (`SRV-006-simuladores`, RF-003).
        `topic` es un topic concreto (sin wildcard), a diferencia de
        `topic_pattern` de `ScanMqttRequest`.
      required: [topic, payload, interval_seconds]
      additionalProperties: false
      properties:
        topic:
          type: string
          minLength: 1
        payload:
          type: string
        interval_seconds:
          type: number
          description: >
            Sin `minimum` a propósito — RF-015 exige 400 RFC 9457, no el 422
            genérico de Pydantic (mismo criterio que `ModbusRangeIn.count`, `SRV-004`).
    SimulatorOut:
      type: object
      description: >
        Simulador en ejecución (`SRV-006-simuladores`, RF-001, RF-002, RF-003, RF-010).
      required: [device_id, protocol, address, started_at]
      additionalProperties: false
      properties:
        device_id:
          type: string
          format: uuid
        protocol:
          type: string
          enum: [bacnet, modbus, mqtt]
        address:
          type: string
        started_at:
          type: string
          format: date-time
    ProblemDetail:
      type: object
      description: >
        Sobre de error RFC 9457 (`E-ADR-003`, convención `type: https://hira.dev/
        errors/<slug>`). Catálogo de slugs de `SRV-002-auth-rbac` (`plan.md §4`):
        `invalid-credentials` (401), `rate-limited` (429), `token-missing` (401),
        `token-invalid` (401), `token-expired` (401), `token-revoked` (401),
        `insufficient-role` (403), `project-scope-denied` (403). Los últimos 4
        (`token-missing`, `insufficient-role`, `project-scope-denied` y el uso de
        `token-invalid` en rutas protegidas genéricas) los emite
        `AuthenticationMiddleware`/`require_role`/`require_project_scope`. Catálogo
        añadido por `SRV-003-bacnet-adapter` (`plan.md §4`): `device-not-found`
        (404, `GET /devices/{id}/candidates` con un `id` inexistente) —
        `insufficient-role` (403) se reutiliza tal cual en los endpoints
        nuevos de `devices`, sin redefinirse. Catálogo añadido por
        `SRV-004-modbus-adapter` (`plan.md §4`): `modbus-range-too-large`
        (400, `POST /devices/scan/modbus` con un rango que excede 125
        direcciones). Catálogo añadido por `SRV-005-mqtt-scanning`
        (`plan.md §4`): `mqtt-invalid-topic-pattern` (400,
        `POST /devices/scan/mqtt` con un `topic_pattern` rechazado por la
        librería MQTT al suscribirse) — `insufficient-role` (403) se
        reutiliza tal cual, sin redefinirse. Catálogo añadido por
        `SRV-006-simuladores` (`plan.md §4`): `simulator-address-conflict`
        (409, la dirección ya es un dispositivo real), `simulator-already-
        running` (409, la dirección ya tiene un simulador en ejecución),
        `simulator-not-running` (404, `DELETE /simulators/{device_id}` sin
        un simulador en ejecución con ese id), `mqtt-invalid-publish` (400,
        `POST /simulators/mqtt` con `topic`/`payload` rechazado al
        publicar — distinto de `mqtt-invalid-topic-pattern`, que valida
        `subscribe()`), `mqtt-invalid-interval` (400, `interval_seconds <= 0`)
        — `insufficient-role` (403) se reutiliza tal cual en `/simulators/*`,
        sin redefinirse.
      required: [type, title, status, detail]
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          example: "https://hira.dev/errors/invalid-credentials"
        title:
          type: string
          example: "Credenciales inválidas"
        status:
          type: integer
          example: 401
        detail:
          type: string
