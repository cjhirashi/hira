# Compose base — perfil único de producción (`E-ADR-001`: sin `HIRA_DEPLOY_MODE`,
# sin perfil `studio`). `SRV-001-walking-skeleton` T-016.
#
# Servicios: `backend` (FastAPI), `postgres` (TimescaleDB), `redis`, `mosquitto`,
# `nginx`. Cada uno con `HEALTHCHECK` propio; `depends_on: condition: service_healthy`
# implementa RF-001/RNF-001 (todos `healthy` en < 60s).
#
# Uso: `docker compose -f docker-compose.yml up -d` (producción) o combinado con
# `docker-compose.dev.yml` (hot-reload, puertos expuestos para debug).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hira-server-backend:latest
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    # HEALTHCHECK definido en `backend/Dockerfile` (curl -f http://localhost:8000/health).
    # Nota (RF-002/plan.md): el compose considera "healthy" con que el proceso
    # responda — no exige que el JSON del body diga `status: ok`.

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    environment:
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/password_file:/mosquitto/config/password_file:ro
    healthcheck:
      # RF-006/VUL-SRV-001: valida que el broker responde Y que la credencial
      # propia del backend funciona (broker con `allow_anonymous false`).
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t healthcheck -m ping -u \"$$MQTT_USER\" -P \"$$MQTT_PASSWORD\" -i healthcheck-probe || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
