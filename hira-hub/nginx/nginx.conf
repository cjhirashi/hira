# hira-hub/nginx/nginx.conf — proxy reverso mínimo hacia `backend`
# (RF-006, `HUB-001-walking-skeleton` T-017).
#
# Genérico/local — sin dominio (`hub.hira.cjhirashi.com`) ni TLS/Let's Encrypt
# real todavía; eso es un sprint operativo posterior
# (`docs/hira-hub/spec/deployment.md`, decisión cerrada en `spec.md §2`).

server {
    listen 80;

    location / {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
