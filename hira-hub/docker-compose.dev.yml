# Override de desarrollo — hot-reload del backend + puertos expuestos al host
# para debug directo (Postgres/Redis). `HUB-001-walking-skeleton` T-016.
#
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  backend:
    volumes:
      - ./backend:/app
    ports:
      - "8001:8001"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
