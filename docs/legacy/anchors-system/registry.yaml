  - { id: VUL-HUB-05, kind: vulnerability, component: hira-hub, title: "BD de Hub sin backup probado equivale a sin backup", spec: .harness/spec/hira-hub/validation/vulnerabilities.md, status: open, notes: "Crítico. Backup diario + restore probado." }
  - { id: VUL-HUB-06, kind: vulnerability, component: hira-hub, title: "JWT del Panel Admin sin expiración corta", spec: .harness/spec/hira-hub/validation/vulnerabilities.md, status: open, notes: "Medio." }

