  # ─────────────────────────────  VULNERABILIDADES — SERVER  ─────────────────────────────
  - { id: VUL-SRV-001, kind: vulnerability, component: hira-server, title: "Mosquitto sin autenticación", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: mitigated, notes: "Crítico. mosquitto.conf allow_anonymous false + password_file." }
  - { id: VUL-SRV-002, kind: vulnerability, component: hira-server, title: "Import de .hira ejecuta SQL crudo", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: mitigated, notes: "Crítico. Formato JSON por ORM, nunca SQL dump." }
  - { id: VUL-SRV-003, kind: vulnerability, component: hira-server, title: "Sin rate limiting en API ni WebSocket", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: mitigated, notes: "Crítico. Nginx limit_req_zone / limit_conn_zone." }
  - { id: VUL-SRV-004, kind: vulnerability, component: hira-server, title: "RBAC con query a BD en cada request", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: mitigated, notes: "Crítico. Permisos en Redis, invalidación al cambiar rol." }
  - { id: VUL-SRV-005, kind: vulnerability, component: hira-server, title: "BAC0 sin lock en escrituras concurrentes", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: open, notes: "Alto. asyncio.Lock por dispositivo en el adaptador BACnet." }
  - { id: VUL-SRV-006, kind: vulnerability, component: hira-server, title: "Sin invalidación inmediata de sesión JWT comprometida", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: accepted-risk, notes: "Medio. Ventana de 15 min aceptada; blacklist de JTIs a futuro." }
  - { id: VUL-SRV-007, kind: vulnerability, component: hira-server, title: "Celery Beat como SPOF del scheduler", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: accepted-risk, notes: "Medio. Mitigado por restart policy + evaluación dual de alarmas; RedBeat a futuro." }
  - { id: VUL-SRV-008, kind: vulnerability, component: hira-server, title: "Contexto del Agente IA se satura en proyectos grandes", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: open, notes: "Medio. Extender RAG al Agente del Integrador." }
  - { id: VUL-SRV-009, kind: vulnerability, component: hira-server, title: "Sin estrategia de compatibilidad de versiones del .hira", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: open, notes: "Medio. Política de versión mayor/menor + migración por versión." }
  - { id: VUL-SRV-010, kind: vulnerability, component: hira-server, title: "BACnet MSTP requiere puerto serial del host", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: open, notes: "Alto. Config opcional de puerto serial en Docker Compose." }
  - { id: VUL-SRV-011, kind: vulnerability, component: hira-server, title: "Simuladores con flag booleano: riesgo de confusión", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: open, notes: "Bajo. Columna device_class (real|simulator) + confirmación explícita." }
  - { id: VUL-SRV-012, kind: vulnerability, component: hira-server, title: "Crash Reporter puede filtrar datos del proyecto en stack traces", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: open, requires: [HUB-ADR-04], notes: "Alto. Sanitizador antes de enviar + test unitario." }
  - { id: VUL-SRV-013, kind: vulnerability, component: hira-server, title: "Webhook del integrador sin validación de SSL del destino", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: open, notes: "Medio. Exigir HTTPS, verificar cert, firmar payload con HMAC." }
  - { id: VUL-SRV-014, kind: vulnerability, component: hira-server, title: "Límite de puntos en línea integrador vs comercial", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: resolved, requires: [SRV-ADR-018], notes: "Alto. Resuelto por rediseño (SRV-ADR-018)." }
  - { id: VUL-SRV-015, kind: vulnerability, component: hira-server, title: "Formato de plantilla .hirat no definido antes del marketplace", spec: .harness/spec/hira-server/validation/vulnerabilities.md, status: open, requires: [CT-marketplace], notes: "Medio. Definir esquema .hirat como extensión de .hira." }

  # ─────────────────────────────  VULNERABILIDADES — HUB  ─────────────────────────────
  - { id: VUL-HUB-01, kind: vulnerability, component: hira-hub, title: "License keys nunca deben almacenarse ni loguearse en claro", spec: .harness/spec/hira-hub/validation/vulnerabilities.md, status: mitigated, requires: [HUB-ADR-02], notes: "Crítico." }
